[project]
name = "knowbase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=2.46.0",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
kb = "knowbase.cli:main"
kb-mcp = "knowbase.mcp_server:main"
kb-web = "knowbase.web:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowbase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
