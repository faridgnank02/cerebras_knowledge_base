services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase
      POSTGRES_DB: knowbase
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
