# Eval questions for knowbase. Format:
#   - question: natural-language question a user would type
#     expected: [source_id, ...]   # any hit in top-k counts
# Authored against the FastAPI corpus ingested 2026-07-19 (3000 issues + 687 code chunks).
# Issue questions are paraphrased (not verbatim titles) so lexical search can't trivially win.
# P2: expanded from 22 to 31 questions — code answers migrated to symbol chunk ids
# (path#symbol@N), plus 9 lexical-strength additions (5 exact error pastes, 4 exact
# identifiers) under the P2 marker below.

