- question: "Where does FastAPI implement running background tasks after a response is returned?"
  expected: ["fastapi/background.py#module"]
- question: "Where is the API key header authentication scheme implemented?"
  expected: ["fastapi/security/api_key.py#APIKeyHeader"]
- question: "Which class represents an uploaded file received in a request?"
  expected: ["fastapi/datastructures.py#UploadFile"]

