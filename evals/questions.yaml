# --- Code questions ---
# Migrated to symbol ids in P2 (post-fix corpus uses path#symbol@N chunk ids, not
# line ranges). Each id below was verified to exist and to cover the same symbol(s)
# the old #L ranges pointed at (see docs/blog/p2-baseline.md for the mapping).
- question: "Where is the OAuth2 password bearer security scheme class implemented?"
  expected: ["fastapi/security/oauth2.py#OAuth2PasswordBearer", "fastapi/security/oauth2.py#__init__@6", "fastapi/security/oauth2.py#__init__@7"]
