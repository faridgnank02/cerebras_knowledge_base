repo:
  name: fastapi/fastapi
  clone_path: ./data/fastapi
issues:
  max_issues: 3000
code:
  paths: ["fastapi"]
  exclude_dirs: ["tests"]
embedding:
  model: BAAI/bge-m3
  dims: 1024
db:
  dsn: postgresql://knowbase:knowbase@localhost:5433/knowbase
search:
  decay_tau_days: 180
  decay_epsilon: 0.00005
llm:
  base_url: https://api.cerebras.ai/v1
  model: gpt-oss-120b
  max_input_chars: 60000
bursts:
  idf_threshold: 4.0
  min_chars: 200
  min_score: 1
